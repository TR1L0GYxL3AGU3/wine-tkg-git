name: Build Wine-tkg & Proton-tkg

on:
  schedule:
    - cron: '0 5,17 * * *' # Runs at midnight (5:00 UTC) and noon (17:00 UTC) CT
  workflow_dispatch:

jobs:
  sync-upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pull Upstream Changes
        run: |
          git remote add upstream https://github.com/Frogging-Family/wine-tkg-git.git
          git fetch upstream master
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@github.com"
          git checkout master
          git merge upstream/master --allow-unrelated-histories --no-edit || true

      - name: Push to Fork
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          repository: ${{ github.repository }}

  build-wine:
    name: Build Wine-tkg (Arch Container)
    needs: sync-upstream
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - uses: actions/checkout@v4
      - name: Compile
        env:
          XDG_CACHE_HOME: /tmp/.cache
        run: |
          echo -e "[multilib]\nInclude = /etc/pacman.d/mirrorlist" >> /etc/pacman.conf
          pacman -Syu --noconfirm base-devel sudo
          useradd user -G wheel && echo "user ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown user -R . && cd wine-tkg-git
          sed -i 's/wayland_driver="false"/wayland_driver="true"/' customization.cfg
          sed -i 's/_NOLIB32="false"/_NOLIB32="wow64"/' wine-tkg-profiles/advanced-customization.cfg
          su user -c "yes|PKGDEST=/tmp/wine-tkg makepkg --noconfirm -s"

      - name: Archive Wine Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wine-tkg-build
          path: /tmp/wine-tkg

  build-proton:
    name: Build Proton-tkg (Sniper/Ubuntu Container)
    needs: sync-upstream
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: LizardByte/actions/actions/more_space@master
        with:
          analyze-space-savings: true
          clean-all: true
          safe-packages: "patch,git"
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libwayland-dev:amd64 libwayland-dev:i386 wayland-protocols libxkbcommon-dev:amd64 libxkbcommon-dev:i386 libxkbregistry-dev:amd64 libxkbregistry-dev:i386
          sed -i 's/_GE_WAYLAND="false"/_GE_WAYLAND="true"/g' wine-tkg-git/wine-tkg-profiles/wine-tkg-valve-exp-bleeding.cfg
          cd proton-tkg
          sed -i 's/uninstaller="false"/uninstaller="true"/' proton-tkg.cfg
          sed -i 's/autoinstall="false"/autoinstall="true"/' proton-tkg.cfg
          sed -i 's/_no_container="false"/_no_container="true"/' proton-tkg.sh
          echo '_nomakepkg_dependency_autoresolver="true"' >> proton-tkg.cfg
          echo '_ci_build="true"' >> proton-tkg.cfg
          touch tarplz
          yes|./proton-tkg.sh
      - name: Archive Proton Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proton-tkg-build
          path: proton-tkg/built/*.tar
